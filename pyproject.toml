[project]
name = "dusha"
version = "0.1.0"
description = "Speech Emotion Recognition on Russian speech (Dusha dataset)"
authors = [
    {name = "Natlis", email = "natalja.sobjanina15@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

# ── Core: базовые пакеты, необходимые для всех экспериментов ──
dependencies = [
    "numpy (>=2.4.3,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "seaborn (>=0.13.0,<1.0.0)",
    "joblib (>=1.5.0,<2.0.0)",
    "tqdm (>=4.67.0,<5.0.0)",
    "soundfile (>=0.13.0,<1.0.0)",
    "librosa (>=0.11.0,<1.0.0)",
    "lmdb (>=1.6.0,<2.0.0)",
    "gensim (>=4.4.0,<5.0.0)",
    "scipy-stubs (>=1.17.1,<1.18.0)",
    "pandas-stubs (>=3.0.5,<3.1.0)",
]

# ── Optional dependency groups ──

[project.optional-dependencies]
# PyTorch + HuggingFace Transformers (для BiLSTM, RuBERT, Wav2Vec2 и др.)
ml = [
    "torch (>=2.6.0,<3.0.0)",
    "torchaudio (>=2.6.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
]

# Анализ данных (для ноутбуков data_analise/)
analysis = [
    "pymorphy3 (>=2.0.0,<3.0.0)",
    "pymorphy3-dicts-ru (>=2.4.0,<3.0.0)",
    "wordcloud (>=1.9.0,<2.0.0)",
]

# Аудио модели: openSMILE + XGBoost
audio-extra = [
    "opensmile (>=2.5.0,<3.0.0)",
    "xgboost (>=2.1.0,<3.0.0)",
]

# Текстовые модели: FastText embeddings
text-extra = [
    "gensim (>=4.3.0,<5.0.0)",
]

# Обработка данных (data_processing/)
processing = [
    "click (>=8.1.0,<9.0.0)",
    "crowd-kit (>=1.4.0,<2.0.0)",
]

# Подбор гиперпараметров (режимы --mode tune моделей)
tuning = [
    "optuna (>=4.0,<5.0)",
]

# Все опциональные зависимости сразу (установка: poetry install --with all)
all = [
    "torch (>=2.6.0,<3.0.0)",
    "torchaudio (>=2.6.0,<3.0.0)",
    "transformers (>=4.40.0,<5.0.0)",
    "pymorphy3 (>=2.0.0,<3.0.0)",
    "pymorphy3-dicts-ru (>=2.4.0,<3.0.0)",
    "wordcloud (>=1.9.0,<2.0.0)",
    "opensmile (>=2.5.0,<3.0.0)",
    "xgboost (>=2.1.0,<3.0.0)",
    "gensim (>=4.3.0,<5.0.0)",
    "click (>=8.1.0,<9.0.0)",
    "crowd-kit (>=1.4.0,<2.0.0)",
    "optuna (>=4.0,<5.0)",
]

# ── Dev dependency group ( Poetry 2.x формат) ──

[dependency-groups]
dev = [
    "setuptools (>=82.0.0,<83.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pandas-stubs (>=3.0.1,<3.1.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "ruff (>=0.11.0,<1.0.0)",
]

# ── Build system ──

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["dusha/my_experiments/tests"]
